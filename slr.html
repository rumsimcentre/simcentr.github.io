<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СЛР - Центр Симуляционного обучения</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: rgba(15, 27, 41, 0.9);
        --panel-soft: rgba(22, 36, 53, 0.9);
        --text: #edf4ff;
        --muted: #b7c7d9;
        --primary: #7cc7ff;
        --primary-strong: #4ba3ff;
        --accent: #8ef3c5;
        --danger: #ff6b6b;
        --line: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(76, 161, 255, 0.2), transparent 28%),
          radial-gradient(circle at bottom right, rgba(142, 243, 197, 0.12), transparent 30%),
          var(--bg);
        color: var(--text);
        line-height: 1.7;
      }

      .page {
        max-width: 1100px;
        margin: 60px auto;
        padding: 32px 24px 48px;
      }

      .header-card {
        background: rgba(15, 27, 41, 0.82);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 28px 28px 18px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .title-icon {
        width: 60px;
        height: 60px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(124, 199, 255, 0.2), rgba(142, 243, 197, 0.12));
        border: 1px solid rgba(124, 199, 255, 0.25);
        font-size: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.1rem);
        letter-spacing: -0.06em;
        color: var(--text);
      }

      .back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #041521;
        font-weight: 700;
        text-decoration: none;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0;
      }

      .tab-btn {
        border: 1px solid rgba(124, 199, 255, 0.2);
        background: rgba(124, 199, 255, 0.1);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .tab-btn.active {
        background: linear-gradient(135deg, rgba(124, 199, 255, 0.25), rgba(142, 243, 197, 0.15));
        border-color: rgba(124, 199, 255, 0.5);
        box-shadow: 0 6px 16px rgba(76, 161, 255, 0.15);
      }

      .tab-btn:hover {
        transform: translateY(-1px);
      }

      .content {
        margin-top: 26px;
      }

      .content h2 {
        margin: 0 0 16px;
        font-size: clamp(1.3rem, 2vw, 1.8rem);
        color: var(--accent);
      }

      .content p {
        color: var(--muted);
        line-height: 1.8;
        margin: 0 0 16px;
      }

      .content li {
        color: var(--muted);
        margin-bottom: 8px;
        line-height: 1.6;
      }

      .warning-box {
        background: rgba(255, 107, 107, 0.1);
        border-left: 4px solid #ff6b6b;
        border-radius: 12px;
        padding: 14px 16px;
        margin: 18px 0;
      }

      .warning-box strong {
        color: #ff8888;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 18px;
      }

      .card {
        background: rgba(22, 36, 53, 0.7);
        border: 1px solid rgba(124, 199, 255, 0.15);
        border-radius: 16px;
        padding: 16px;
      }

      .card h3 {
        margin: 0 0 8px;
        color: var(--text);
        font-size: 1rem;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .placeholder {
        min-height: 200px;
        border: 1px dashed rgba(124, 199, 255, 0.3);
        border-radius: 16px;
        background: rgba(124, 199, 255, 0.04);
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
        padding: 18px;
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: clamp(1.5rem, 3vw, 2.2rem);
        }

        .page {
          padding: 24px 16px 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header-card">
        <div class="topbar">
          <div class="title-wrap">
            <div class="title-icon">🚑</div>
            <h1>Сердечно-лёгочная реанимация</h1>
          </div>
          <a href="index.html" class="back">← Назад</a>
        </div>

        <div class="tabs" id="tabs"></div>
        <div class="content" id="content"></div>
      </div>
    </div>

    <script>
      const courseData = {
        slr: {
          name: "Сердечно-лёгочная реанимация",
          icon: "🚑",
          tabs: [
            {
              title: "Алгоритм",
              content: `
                <h2>Алгоритм выполнения СЛР</h2>
                <ol>
                  <li>Проверить сознание (похлопать по щеке, позвать пациента)</li>
                  <li>Позвать на помощь и вызвать скорую помощь (112)</li>
                  <li>Положить пациента на спину на твёрдую поверхность</li>
                  <li>Запрокинуть голову пациента назад</li>
                  <li>Провести прямой массаж сердца (100-120 нажатий в минуту)</li>
                  <li>Проводить искусственное дыхание (2 вдоха на 30 нажатий)</li>
                </ol>
              `
            },
            {
              title: "Техника",
              content: `
                <h2>Техника массажа сердца</h2>
                <p>Основные моменты:</p>
                <ul>
                  <li>Встать сбоку от пациента</li>
                  <li>Положить основание одной ладони на нижнюю половину грудины</li>
                  <li>Положить вторую ладонь сверху</li>
                  <li>Надавливать с частотой 100-120 раз в минуту</li>
                  <li>Глубина надавливания: 5-6 см</li>
                </ul>
                <div class="warning-box">
                  <strong>⚠️ Важно:</strong> Не прерывайте массаж более чем на 10 секунд!
                </div>
              `
            },
            {
              title: "Признаки",
              content: `
                <h2>Признаки клинической смерти</h2>
                <ul>
                  <li>Потеря сознания</li>
                  <li>Отсутствие пульса на сонной артерии</li>
                  <li>Отсутствие дыхания</li>
                  <li>Расширенные зрачки</li>
                  <li>Потеря мышечного тонуса</li>
                </ul>
              `
            }
          ]
        }
      };

      const course = courseData.slr;
      const tabsContainer = document.getElementById("tabs");
      const contentContainer = document.getElementById("content");

      // Render tabs
      course.tabs.forEach((tab, index) => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${index === 0 ? "active" : ""}`;
        btn.textContent = tab.title;
        btn.onclick = () => switchTab(index);
        tabsContainer.appendChild(btn);
      });

      function switchTab(index) {
        document.querySelectorAll(".tab-btn").forEach((btn, i) => {
          btn.classList.toggle("active", i === index);
        });
        contentContainer.innerHTML = course.tabs[index].content;
      }

      // Show first tab by default
      contentContainer.innerHTML = course.tabs[0].content;
    </script>
  </body>
</html>
